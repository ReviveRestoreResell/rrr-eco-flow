  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__</script>
<script>(() => {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia("(prefers-color-scheme: dark)");
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    "codex-visualization-widget-state",
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? "{}");
  initialStateElement?.remove();
  /** @type {Record<string, unknown> | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? "none";
  let nextStateRequestId = 0;
  /** @type {Map<number, { resolve: () => void; reject: (error: Error) => void; timeout: ReturnType<typeof globalThis.setTimeout>; serializedState: string }>} */
  const pendingStateWrites = new Map();
  const persistenceError = () =>
    Object.assign(
      new Error("The host could not persist the widget state update"),
      {
        code: -32000,
        data: { code: "widget_state_persistence_failed", retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) => {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, "data");
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, "ports");
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, "source");
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) => {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("open-external", { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("follow-up", { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record<string, unknown> | ((previous: Record<string, unknown> | null) => Record<string, unknown>)} next
   * @returns {Promise<void>}
   */
  const setWidgetState = async (next) => {
    const nextState = typeof next === "function" ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== "object" ||
      isArray(nextState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) => {
        if (
          typeof value === "undefined" ||
          typeof value === "function" ||
          typeof value === "symbol" ||
          (typeof value === "number" && !Number.isFinite(value))
        ) {
          throw new TypeError("Widget state must be a JSON object");
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== "object" ||
      isArray(parsedState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    if (
      hasOwn(storedState, "imageIds") &&
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) => typeof id !== "string",
        ))
    ) {
      throw new TypeError("Widget state imageIds must be an array of strings");
    }
    if (storedState.imageIds?.length > 0) {
      throw Object.assign(
        new TypeError("Visualization state does not support image attachments"),
        { code: -32602, data: { code: "images_unsupported" } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === "none") {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) => {
      const timeout = globalThis.setTimeout(() => {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost("widget-state-write", { id, state: serializedState });
    });
  };
  const syncTheme = () => {
    const theme = mediaQuery.matches ? "dark" : "light";
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: "none",
    };
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () => {
    postToHost("height", {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    "message",
    (event) => {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== "object" ||
        data?.type !== "codex-visualization-initialize" ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          "message",
          (event) => {
            const data = apply(getMessageData, event, []);
            if (typeof data === "object" && data?.type === "measure") {
              sendHeight();
            } else if (
              typeof data === "object" &&
              data?.type === "widget-state-result"
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== "number") {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost("widget-state-write", { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener("change", syncTheme);
  globalThis.addEventListener("click", (event) => {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest("a[href]");
    const href = link?.getAttribute("href");
    if (href == null) {
      return;
    }
    if (href.startsWith("#")) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost("scroll-to", {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
</script>

    if (page.type === 'root') return page.id === 'root';
    if (page.type === 'stage') return stages.some(stage => stage.id === page.id);
    if (page.type === 'listing-step') return Boolean(listingSteps[page.id]);
    if (page.type === 'pillar') return Boolean(pillarQuestions[page.id]);
    return false;
  }

  function pageFromAddress() {
    const params = new URL(window.location.href).searchParams;
    const page = { type: params.get('view'), id: params.get('page') };
    return isValidPage(page) ? page : null;
  }

  function syncPageAddress(page) {
    if (!['http:', 'https:', 'file:'].includes(window.location.protocol)) return;
    const url = new URL(window.location.href);
    if (page.type === 'root') {
      url.searchParams.delete('view');
      url.searchParams.delete('page');
    } else {
      url.searchParams.set('view', page.type);
      url.searchParams.set('page', page.id);
    }
    window.history.replaceState(null, '', url.toString());
  }

  const linkedPage = pageFromAddress();
  const saved = window.openai?.widgetState?.privateContent;
  if (linkedPage) current = linkedPage;
  else if (isValidPage(saved)) current = saved;

  function button(label, action, primary = false) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = primary ? 'btn btn-primary' : 'btn';
    el.textContent = label;
    el.addEventListener('click', action);
    return el;
  }

  function arrow() {
    const el = document.createElement('span');
    el.className = 'flow-arrow';
    el.setAttribute('aria-hidden', 'true');
    el.textContent = '→';
    return el;
  }

  function pageLead(label, text) {
    const lead = document.createElement('div');
    lead.className = 'page-lead';
    const mark = document.createElement('div');
    mark.className = 'page-mark';
    mark.textContent = label;
    const copy = document.createElement('p');
    copy.textContent = text;
    lead.append(mark, copy);
    content.append(lead);
  }

  function sectionLabel(text) {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = text;
    content.append(label);
  }

  function developPanel(name, prompt) {
    const panel = document.createElement('div');
    panel.className = 'develop-panel';
    const heading = document.createElement('h2');
    heading.textContent = 'Ready to develop';
    const note = document.createElement('p');
    note.textContent = `Build the open questions, decisions, ownership, evidence, and reporting for ${name}.`;
    panel.append(heading, note, button('Develop this step', () => askCodex(prompt), true));
    content.append(panel);
  }

  function frameworkSection(key) {
    const data = { ...frameworks.default, ...(frameworks[key] || {}) };
    const details = document.createElement('details');
    details.className = 'framework';
    const summary = document.createElement('summary');
    summary.className = 'cursor-interaction';
    summary.textContent = 'Operating framework';
    const grid = document.createElement('dl');
    grid.className = 'framework-grid';
    [
      ['Systems & tools', data.systems],
      ['Procedure', data.procedure],
      ['Roles', data.roles],
      ['Responsibilities', data.responsibilities],
      ['Evidence & reporting', data.evidence]
    ].forEach(([label, value]) => {
      const item = document.createElement('div');
      item.className = 'framework-item';
      const term = document.createElement('dt');
      term.textContent = label;
      const desc = document.createElement('dd');
      desc.textContent = value;
      item.append(term, desc);
      grid.append(item);
    });
    details.append(summary, grid);
    content.append(details);
  }

  function setPage(next, push = true) {
    if (push) history.push(current);
    current = next;
    syncPageAddress(current);
    window.openai?.setWidgetState({
      modelContent: { view: current.type, selection: current.id },
      privateContent: current
    }).catch(() => {});
    render();
  }

  function parentFor(page) {
    if (page.type === 'listing-step') return { type: 'stage', id: 'listing' };
    if (page.type === 'pillar') {
      if (page.id === 'new') return { type: 'stage', id: 'listing' };
      return { type: 'stage', id: 'published' };
    }
    if (page.type === 'stage') return { type: 'root', id: 'root' };
    return { type: 'root', id: 'root' };
  }

  function setChrome(pageTitle, crumbs) {
    title.textContent = pageTitle;
    breadcrumb.textContent = crumbs;
    backButton.hidden = current.type === 'root';
    homeButton.hidden = current.type === 'root';
  }

  function renderRoot() {
    setChrome('RRR Ecosystem', 'ECO-FLOW');
    const cover = document.createElement('div');
    cover.className = 'eco-cover';
    cover.setAttribute('aria-label', 'Circular ECO-FLOW from Sourcing through Fulfillment');

    const ground = document.createElement('div');
    ground.className = 'eco-ground';
    ground.setAttribute('aria-hidden', 'true');
    const trunk = document.createElement('div');
    trunk.className = 'eco-trunk';
    trunk.setAttribute('aria-hidden', 'true');
    const canopy = document.createElement('div');
    canopy.className = 'eco-canopy';
    canopy.setAttribute('aria-hidden', 'true');
    cover.append(ground, trunk, canopy);

    const center = document.createElement('div');
    center.className = 'eco-center';
    const brand = document.createElement('strong');
    ['REVIVE', 'RESTORE', 'RESELL'].forEach(word => {
      const row = document.createElement('span');
      row.className = 'eco-brand-row';
      row.textContent = word;
      brand.append(row);
    });
    const flow = document.createElement('span');
    flow.textContent = 'ECO-FLOW';
    center.append(brand, flow);
    cover.append(center);

    stages.forEach((stage, index) => {
      const stageWrap = document.createElement('div');
      stageWrap.className = `eco-stage eco-stage-${index + 1}`;
      const halo = document.createElement('span');
      halo.className = 'eco-stage-halo';
      halo.setAttribute('aria-hidden', 'true');
      const node = button(stage.name, () => setPage({ type: 'stage', id: stage.id }));
      node.classList.add('btn-ghost');
      node.setAttribute('aria-label', `${stage.name}: ${stage.short}`);
      stageWrap.append(halo, node);
      cover.append(stageWrap);
    });
    content.append(cover);

    const note = document.createElement('p');
    note.className = 'text-small text-muted path-note text-center';
    note.textContent = 'Tap any stage to follow the item journey. Listing and Published contain the marketplace workflows.';
    content.append(note);
  }

  function renderGenericStage(stage) {
    setChrome(stage.name, `ECO-FLOW › ${stage.name}`);
    pageLead(stage.name, stage.short);
    sectionLabel('Stage development');
    developPanel(stage.name, `Help us build the open-question outline for the ${stage.name} stage of the RRR ECO-FLOW. Start from scratch, avoid assumptions, and include the required operating-framework question.`);
    frameworkSection(`stage-${stage.id}`);
  }

  function renderListing() {
    setChrome('Listing', 'ECO-FLOW › Listing');
    pageLead('Listing', 'Turn verified Item Truth into a complete, reviewable listing ready for authorized publication.');
    sectionLabel('Listing path');

    const journey = document.createElement('div');
    journey.className = 'listing-journey';

    const top = document.createElement('div');
    top.className = 'flow-track';
    top.append(
      button('Placeholder', () => setPage({ type: 'listing-step', id: 'placeholder' }), true),
      arrow(),
      button('Capture', () => setPage({ type: 'listing-step', id: 'capture' }))
    );
    const lanesLabel = document.createElement('span');
    lanesLabel.className = 'text-small listing-branch-label';
    lanesLabel.textContent = 'Capture builds four coordinated listing parts';
    journey.append(top, lanesLabel);

    const lanes = document.createElement('div');
    lanes.className = 'lane-grid';
    ['forms', 'copy', 'price', 'photo'].forEach(id => {
      const wrap = document.createElement('div');
      wrap.className = 'lane-wrap';
      const caption = document.createElement('p');
      caption.className = 'lane-caption';
      caption.textContent = 'built from Capture';
      wrap.append(button(listingSteps[id].name, () => setPage({ type: 'listing-step', id })), caption);
      lanes.append(wrap);
    });
    journey.append(lanes);

    const connector = document.createElement('div');
    connector.className = 'path-connector';
    connector.setAttribute('aria-hidden', 'true');
    connector.textContent = '↓';
    journey.append(connector);

    const finish = document.createElement('div');
    finish.className = 'flow-track';
    finish.append(
      button('Review', () => setPage({ type: 'listing-step', id: 'review' })),
      arrow(),
      button('List', () => setPage({ type: 'listing-step', id: 'list' })),
      arrow()
    );
    const published = button('Published', () => setPage({ type: 'stage', id: 'published' }), true);
    finish.append(published);
    journey.append(finish);
    content.append(journey);

    sectionLabel('Marketplace workflows');
    const workflows = document.createElement('div');
    workflows.className = 'workflow-grid';
    [['new', 'Build a new listing through publication'], ['crosslisted', 'Extend a listing to another marketplace']].forEach(([id, detail]) => {
      const row = document.createElement('div');
      row.className = 'workflow';
      const copy = document.createElement('div');
      const name = document.createElement('strong');
      name.textContent = pillarQuestions[id].name;
      const note = document.createElement('span');
      note.textContent = detail;
      copy.append(name, note);
      row.append(copy, button('Open', () => setPage({ type: 'pillar', id })));
      workflows.append(row);
    });
    content.append(workflows);
    frameworkSection('listing');
  }

  function renderPublished() {
    setChrome('Published', 'ECO-FLOW › Published');
    pageLead('Published', 'Manage active marketplace listings, growth actions, and the handoff created when an item sells.');

    sectionLabel('Previous workflow');
    const previous = document.createElement('div');
    previous.className = 'flow-track';
    previous.append(
      button('Review', () => setPage({ type: 'listing-step', id: 'review' })),
      arrow(),
      button('List', () => setPage({ type: 'listing-step', id: 'list' })),
      arrow(),
      button('Published', () => {}, true)
    );
    content.append(previous);

    sectionLabel('Active listing workflows');

    const workflows = document.createElement('div');
    workflows.className = 'workflow-grid';
    const details = {
      relist: 'Renew marketplace visibility',
      crosslisted: 'Extend to additional marketplaces',
      refresh: 'Improve price, copy, forms, or photos',
      campaigns: 'Run sales, reductions, coupons, or offers'
    };
    ['relist', 'crosslisted', 'refresh', 'campaigns'].forEach(id => {
      const row = document.createElement('div');
      row.className = 'workflow';
      const copy = document.createElement('div');
      const name = document.createElement('strong');
      name.textContent = pillarQuestions[id].name;
      const note = document.createElement('span');
      note.textContent = details[id];
      copy.append(name, note);
      row.append(copy, button('Open', () => setPage({ type: 'pillar', id })));
      workflows.append(row);
    });
    content.append(workflows);

    sectionLabel('Sale handoff');
    const sold = document.createElement('div');
    sold.className = 'flow-track';
    sold.append(
      button('Active listing', () => {}),
      arrow(),
      button('Sold', () => {}),
      arrow(),
      button('Fulfillment', () => setPage({ type: 'stage', id: 'fulfillment' }), true)
    );
    content.append(sold);
    frameworkSection('published');
  }

  function renderListingStep(step) {
    if (current.id === 'capture') {
      setChrome('Capture', 'ECO-FLOW › Listing › Capture');
      pageLead('Capture', 'Establish source-qualified Item Truth that can feed Forms, Copy, Price, and Photo work.');
      sectionLabel('Current workflow');

      const map = document.createElement('dl');
      map.className = 'capture-map';
      [
        ['Input', 'Exact SKU, item type, and the available manufacturer, label, bench, and photo evidence.'],
        ['Capture', 'Identity, variant, labels, construction, condition, measurements, source, authority, and scope.'],
        ['Complete', 'Known facts are verified; unresolved applicable facts are visible flags; the record is saved and reopened.'],
        ['Feeds', 'Forms, Copy, Price, and Photo Clinic reuse saved Item Truth.']
      ].forEach(([label, value]) => {
        const item = document.createElement('div');
        item.className = 'capture-item';
        const term = document.createElement('dt');
        term.textContent = label;
        const description = document.createElement('dd');
        description.textContent = value;
        item.append(term, description);
        map.append(item);
      });
      content.append(map);

      const rule = document.createElement('p');
      rule.className = 'capture-rule';
      rule.textContent = 'No guessing. No gates. Capture once; consume downstream.';
      content.append(rule);
      frameworkSection('capture');
      return;
    }

    if (current.id === 'forms') {
      setChrome('Forms', 'ECO-FLOW › Listing › Forms');
      pageLead('Forms', 'Use verified Item Truth to complete forms for eBay, Poshmark, Depop, Mercari, FBMP, and Vendoo.');
      sectionLabel('Current workflow');

      const map = document.createElement('dl');
      map.className = 'capture-map';
      [
        ['Input', 'Verified Item Truth for the exact SKU.'],
        ['Contract', 'Set the exact value or action for each applicable field.'],
        ['Build', 'Complete eBay, Poshmark, Depop, Mercari, FBMP, then Vendoo.'],
        ['Complete', 'Required fields are complete; unresolved facts remain visible.'],
        ['Feeds', 'Listing Review.']
      ].forEach(([label, value]) => {
        const item = document.createElement('div');
        item.className = 'capture-item';
        const term = document.createElement('dt');
        term.textContent = label;
        const description = document.createElement('dd');
        description.textContent = value;
        item.append(term, description);
        map.append(item);
      });
      content.append(map);

      frameworkSection('forms');
      return;
    }

    const compactWorkflows = {
      placeholder: {
        lead: 'Create the usable Vendoo shell that starts Listing.',
        rows: [
          ['Input', 'Exact SKU, source image or images, Vendoo category, labels, and Internal Notes.'],
          ['Build', 'Create the item shell in Vendoo.'],
          ['Complete', 'The required shell elements are present and any issues remain visible.'],
          ['Feeds', 'Capture, then Forms, Copy, Price, and Photo Clinic.']
        ]
      },
      copy: {
        lead: 'Create approved buyer-facing copy for eBay, Poshmark, FBMP, Mercari, Depop, and Vendoo.',
        rows: [
          ['Input', 'Verified Item Truth for the exact SKU.'],
          ['Create', 'Buyer Discovery builds MAIN, Mercari, and Depop copy.'],
          ['Approve', 'Vaughn or Tracie approves the exact wording.'],
          ['Complete', 'Approved copy is installed only where authorized.'],
          ['Feeds', 'Listing Review.']
        ]
      },
      price: {
        lead: 'Set the right opening price from verified item facts and current market evidence.',
        rows: [
          ['Input', 'Verified Item Truth, prior rulings, and current RRR, eBay, and Poshmark evidence.'],
          ['Research', 'Recommend the opening price and anticipated sale.'],
          ['Rule', 'Vaughn or Tracie sets the final price.'],
          ['Complete', 'The ruled price is installed only where authorized.'],
          ['Feeds', 'Listing Review.']
        ]
      },
      photo: {
        lead: 'Build an accurate, approved Photo Pack for the exact SKU.',
        rows: [
          ['Input', 'Exact-SKU photos, physical evidence, and verified Item Truth.'],
          ['Create', 'Photo Clinic prepares the buyer photo set.'],
          ['Review', 'Fidelity is checked and Vaughn or Tracie approves the set.'],
          ['Complete', 'The approved Photo Pack is ready for authorized installation.'],
          ['Feeds', 'Listing Review.']
        ]
      },
      review: {
        lead: 'Give Vaughn or Tracie one quiet review showing only decisions and action needed.',
        rows: [
          ['Input', 'Forms, Copy, Price, Photo, and visible flags for the exact SKU.'],
          ['Review', 'Show the completed listing and only the exceptions needing attention.'],
          ['Decide', 'Approve, revise, or create an exact work order.'],
          ['Complete', 'Owner decisions and remaining flags are recorded.'],
          ['Feeds', 'List, after explicit publication authorization.']
        ]
      },
      list: {
        lead: 'Publish the reviewed listing only with current owner authority.',
        rows: [
          ['Input', 'The reviewed SKU, named marketplaces, and explicit publication authority.'],
          ['Publish', 'Carry out only the authorized listing action.'],
          ['Verify', 'Confirm the listing is live on every required marketplace.'],
          ['Complete', 'The publication result is recorded.'],
          ['Feeds', 'Published.']
        ]
      }
    };

    const compact = compactWorkflows[current.id];
    if (compact) {
      setChrome(step.name, `ECO-FLOW › Listing › ${step.name}`);
      pageLead(step.name, compact.lead);
      sectionLabel('Current workflow');

      const map = document.createElement('dl');
      map.className = 'capture-map';
      compact.rows.forEach(([label, value]) => {
        const item = document.createElement('div');
        item.className = 'capture-item';
        const term = document.createElement('dt');
        term.textContent = label;
        const description = document.createElement('dd');
        description.textContent = value;
        item.append(term, description);
        map.append(item);
      });
      content.append(map);
      frameworkSection(current.id);
      return;
    }

    setChrome(step.name, `ECO-FLOW › Listing › ${step.name}`);
    pageLead(step.name, step.meaning);
    sectionLabel('Step development');
    developPanel(step.name, `Develop the open-question outline for the ${step.name} step inside RRR Listing Production. Use the current RRR Ecosystem context, make no unsupported assumptions, and include policies, procedures, systems, ownership, roles, evidence, reporting, and review.`);
    frameworkSection(current.id);
  }

  function renderPillar(pillar) {
    setChrome(pillar.name, `RRR Ecosystem › ${pillar.home} › ${pillar.name}`);
    pageLead('Workflow', 'Answer these questions to define the goal, completion rule, evidence, handling, and operating framework.');
    sectionLabel(`${pillar.questions.length} open questions`);

    const list = document.createElement('div');
    list.className = 'question-list';
    pillar.questions.forEach((question, index) => {
      const row = document.createElement('div');
      row.className = 'question-row';
      const number = document.createElement('span');
      number.className = 'question-number';
      number.textContent = index + 1;
      const text = document.createElement('p');
      text.className = 'question-text';
      text.textContent = question;
      row.append(number, text, button('Open', () => askCodex(`For the RRR ${pillar.name} workflow, help us answer this open question without assuming the answer: ${question}`)));
      list.append(row);
    });
    content.append(list);
    frameworkSection(current.id);
  }

  function askCodex(prompt) {
    if (window.openai?.sendFollowUpMessage) {
      window.openai.sendFollowUpMessage({ prompt, title: 'Continue ECO-FLOW planning' });
      return;
    }
    content.replaceChildren();
    setChrome('Open planning question', 'RRR Ecosystem › Question');
    const note = document.createElement('p');
    note.textContent = 'Copy this question into your RRR planning conversation, then return here when the answer is ready to record.';
    const field = document.createElement('textarea');
    field.className = 'form-control';
    field.rows = 7;
    field.readOnly = true;
    field.value = prompt;
    const copy = button('Copy question', async () => {
      try {
        await navigator.clipboard.writeText(prompt);
        copy.textContent = 'Copied';
      } catch (error) {
        field.focus();
        field.select();
        document.execCommand('copy');
        copy.textContent = 'Copied';
      }
    }, true);
    content.append(note, field, copy);
  }

  function render() {
    content.replaceChildren();
    if (current.type === 'root') {
      renderRoot();
      return;
    }
    if (current.type === 'stage') {
      const stage = stages.find(item => item.id === current.id) || stages[0];
      if (stage.id === 'listing') renderListing();
      else if (stage.id === 'published') renderPublished();
      else renderGenericStage(stage);
      return;
    }
    if (current.type === 'listing-step') {
      renderListingStep(listingSteps[current.id] || listingSteps.placeholder);
      return;
    }
    if (current.type === 'pillar') {
      renderPillar(pillarQuestions[current.id] || pillarQuestions.crosslisted);
      return;
    }
    current = { type: 'root', id: 'root' };
    renderRoot();
  }

  backButton.addEventListener('click', () => {
    const previous = history.length ? history.pop() : parentFor(current);
    setPage(previous, false);
  });
  homeButton.addEventListener('click', () => {
    history = [];
    setPage({ type: 'root', id: 'root' }, false);
  });
  window.addEventListener('openai:set_globals', event => {
    const next = event.detail?.globals?.widgetState?.privateContent;
    if (next && typeof next === 'object' && next.type && next.id) {
      current = next;
      history = [];
      syncPageAddress(current);
      render();
    }
  });

  render();
})();
</script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
